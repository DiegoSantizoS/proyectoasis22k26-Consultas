<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <link href="css/estilos.css" rel="stylesheet" type="text/css">
    <title>Consulta Compleja - Ayuda</title>
</head>

<body>

    <div class="encabezado">
        <img class="logo" src="img/LogoConsultas.png" alt="Consultas">
        <h1>Capacitación - Consultas</h1>
        <p class="subtitulo">Uso de consultas con varias tablas</p>
    </div>

    <div class="container">
        
        <div class="seccion">
            <h2>Consulta compleja</h2>
            <p>
                La consulta compleja permite combinar información de varias tablas y aplicar
                condiciones adicionales. Utilice esta opción cuando la información requerida
                no pueda obtenerse desde una sola tabla.
            </p>

            <img class="captura" src="img/ConsultaCompleja.png" alt="Consulta compleja">
        </div>
        
    </div>
